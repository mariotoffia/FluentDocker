name: CI

on:
  push:
    branches:
      - master
      - main
      - fdv3
      - 'support/**'
  pull_request:
  # Disabled: the weekly scheduled integration-test run fails every time (no Docker
  # daemon available on the hosted runners for the full OS matrix). Run integration
  # tests on demand via workflow_dispatch (run_integration: true) instead. Re-enable
  # by uncommenting once the scheduled run is reliable.
  # schedule:
  #   - cron: '0 6 * * 1'  # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration tests'
        required: false
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - name: Detect environment
        id: detect-env
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" == "nektos/act" ]; then
            echo "running_in_act=true" >> $GITHUB_OUTPUT
          else
            echo "running_in_act=false" >> $GITHUB_OUTPUT
          fi

      - name: Echo environment
        shell: bash
        run: |
          echo "Running in act environment: ${{ steps.detect-env.outputs.running_in_act }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Read release version
        id: version
        shell: bash
        run: |
          # Single source of truth: <Version> in Directory.Build.props.
          VERSION=$(dotnet msbuild FluentDocker/FluentDocker.csproj -getProperty:Version -nologo -verbosity:quiet | tr -d '[:space:]')
          echo "Release version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Build examples
        if: matrix.os == 'ubuntu-latest'
        run: dotnet build Examples/Examples.sln --configuration Release

      - name: Run tests (in act)
        if: steps.detect-env.outputs.running_in_act == 'true'
        env:
          TERM: dumb
          DOTNET_CLI_UI_LANGUAGE: en-US
        run: |
          echo "Running in act environment"
          dotnet test \
            --no-build \
            --configuration Release \
            --framework net10.0 \
            --filter "Category=Unit" \
            --logger "console;verbosity=detailed"

      - name: Run tests with coverage (in GitHub)
        if: steps.detect-env.outputs.running_in_act != 'true'
        run: >
          dotnet test
          --no-build
          --configuration Release
          --framework net10.0
          --filter "Category=Unit"
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --settings coverletArgs.runsettings

      # Coverage regression gate (finding M22). The XPlat collector cannot fail the
      # build on a threshold itself (that is a coverlet.msbuild feature), so we enforce
      # a conservative line/branch FLOOR on the collected OpenCover report here. Floors
      # are well below the current line=80.65% / branch=73.51% (measured 2026-06-24) so
      # they only fail on a real regression. Raise them as coverage improves.
      - name: Enforce coverage threshold
        if: steps.detect-env.outputs.running_in_act != 'true' && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          COVERAGE_REPORT_DIR: ./coverage
          COVERAGE_LINE_MIN: '70'
          COVERAGE_BRANCH_MIN: '65'
        run: bash scripts/coverage-threshold

      # Per-assembly coverage report (finding M22). ReportGenerator emits a per-assembly
      # summary (TextSummary) + HTML from the OpenCover report; uploaded as an artifact.
      - name: Generate per-assembly coverage report
        if: steps.detect-env.outputs.running_in_act != 'true' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            "-reports:./coverage/**/coverage.opencover.xml" \
            "-targetdir:./coverage/report" \
            "-reporttypes:HtmlInline;TextSummary;Cobertura"

      - name: Upload coverage report artifact
        if: steps.detect-env.outputs.running_in_act != 'true' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          # Raw OpenCover XML + the per-assembly ReportGenerator output (Summary.txt, HTML).
          path: |
            coverage/**/coverage.opencover.xml
            coverage/report/**
          retention-days: 7
          if-no-files-found: warn

      - name: Run unit tests (net8.0)
        # The product ships net8.0;net10.0, so verify the unit suite on net8.0 too.
        run: >
          dotnet test
          --no-build
          --configuration Release
          --framework net8.0
          --filter "Category=Unit"

      - name: Upload coverage reports to Codecov
        if: steps.detect-env.outputs.running_in_act != 'true' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Create NuGet packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Creating NuGet packages at version ${{ steps.version.outputs.version }}"
          dotnet pack --configuration Release --no-build --output packages

      - name: Validate NuGet packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          EXPECTED=("FluentDocker" "FluentDocker.Testing.Xunit" "FluentDocker.Testing.MsTest" "FluentDocker.Testing.NUnit")
          for pkg in "${EXPECTED[@]}"; do
            ls packages/${pkg}.*.nupkg 1>/dev/null 2>&1 || { echo "MISSING: ${pkg}"; exit 1; }
            echo "OK: ${pkg}"
          done

      - name: List NuGet packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Created NuGet packages:"
          ls -la packages/*.nupkg

      - name: Upload NuGet packages as artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: packages/*.nupkg
          retention-days: 7
        continue-on-error: ${{ steps.detect-env.outputs.running_in_act == 'true' }}

      - name: Publish NuGet packages
        if: matrix.os == 'ubuntu-latest' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/support/'))
        run: |
          dotnet nuget push "packages/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        continue-on-error: ${{ steps.detect-env.outputs.running_in_act == 'true' }}

      - name: Create and push Git tag for release
        if: matrix.os == 'ubuntu-latest' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/support/')) && steps.detect-env.outputs.running_in_act != 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # actions/checkout@v4 does not fetch tags, so check the remote
          # directly. `--exit-code` makes ls-remote return non-zero when no
          # matching ref exists, which we use to decide whether to push.
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag $RELEASE_VERSION already exists on remote, skipping"
          else
            echo "Creating Git tag for version: $RELEASE_VERSION"
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git tag "$RELEASE_VERSION"
            git push origin "$RELEASE_VERSION"
          fi

  # CodeQL Security Analysis
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: +security-and-quality

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build for CodeQL
        run: |
          dotnet restore
          dotnet build --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  # Integration tests — run on PRs (ubuntu only), schedule, or manual dispatch.
  #
  # RELEASE GATE (H9 residual): PR/hosted runs lack a Docker Model Runner, so the DMR
  # integration tests self-skip there. Before tagging a release you MUST run the real DMR
  # gate: trigger this workflow via workflow_dispatch with run_integration=true on a
  # DMR-capable (self-hosted) runner. That sets FLUENTDOCKER_REQUIRE_DMR=1 below, which
  # hard-fails on a missing/unstable runner instead of masking zero coverage with a green
  # self-skip. See docs/model-runner.md (Testing) for the full procedure.
  integration-tests:
    name: Integration Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # PRs: ubuntu only (fast feedback). Schedule/dispatch: full matrix.
        os: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_integration == true)) && fromJson('["ubuntu-latest","macos-latest","windows-latest"]') || fromJson('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_integration == true)
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check Docker availability
        id: docker-check
        shell: bash
        run: |
          if docker info > /dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Docker Model Runner availability
        id: dmr-check
        shell: bash
        run: |
          # The DMR (model-runner) integration tests self-skip via the xUnit dynamic-skip
          # sentinel when the runner is absent.
          if docker model status > /dev/null 2>&1; then
            echo "Docker Model Runner is available — DMR integration tests will run"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docker Model Runner not available — DMR integration tests will skip"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require DMR for explicitly-requested integration runs
        # On a scheduled or manually-requested (run_integration=true) run, a missing DMR
        # must FAIL — otherwise the DMR tests self-skip and the run passes with zero real
        # Model Runner coverage. PR runs still skip cleanly (hosted runners lack DMR).
        if: >
          steps.dmr-check.outputs.available != 'true' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.run_integration == true))
        shell: bash
        run: |
          echo "::error::Docker Model Runner is unavailable, but a DMR integration run was explicitly requested."
          echo "DMR integration tests would self-skip, masking zero real coverage. Use a DMR-capable runner."
          exit 1

      - run: dotnet restore

      - run: dotnet build --configuration Debug --no-restore

      - name: Run integration tests
        if: steps.docker-check.outputs.available == 'true'
        env:
          # On must-run lanes (schedule / manual run_integration=true) a missing or unstable
          # DMR must HARD-FAIL the test rather than self-skip — otherwise the DMR tests emit
          # the xUnit dynamic-skip sentinel and the run passes green with zero real coverage.
          # Empty on PRs so they continue to skip cleanly on DMR-less hosted runners.
          FLUENTDOCKER_REQUIRE_DMR: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_integration == true)) && '1' || '' }}
        run: dotnet test FluentDocker.Tests/FluentDocker.Tests.csproj --configuration Debug --no-build --verbosity normal --filter "Category=Integration"
        timeout-minutes: 30

      - name: Skip integration tests (no Docker)
        if: steps.docker-check.outputs.available != 'true'
        shell: bash
        run: |
          echo "Docker not available on this runner — skipping integration tests"

  # Model Runner benchmarks — deterministic (no DMR), so they run anywhere. Kept off
  # PRs to keep them fast; runs on schedule or manual dispatch only. A perf blip must
  # never fail CI, so this job is non-gating (continue-on-error) and uploads results.
  model-runner-benchmarks:
    name: Model Runner Benchmarks
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    continue-on-error: true
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run Model Runner benchmarks (short job)
        run: >
          dotnet run -c Release --project FluentDocker.Benchmarks --
          --filter "*ModelRunner*"
          --job short

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-runner-benchmarks
          path: BenchmarkDotNet.Artifacts/**
          retention-days: 7
          if-no-files-found: warn
