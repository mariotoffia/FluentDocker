name: CI

on:
  push:
    branches:
      - master
      - main
      - fdv3
      - 'support/**'
  pull_request:
  # Disabled: the weekly scheduled integration-test run fails every time (no Docker
  # daemon available on the hosted runners for the full OS matrix). Run integration
  # tests on demand via workflow_dispatch (run_integration: true) instead. Re-enable
  # by uncommenting once the scheduled run is reliable.
  # schedule:
  #   - cron: '0 6 * * 1'  # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration tests'
        required: false
        type: boolean
        default: false
      run_dmr:
        description: 'Run the real Docker Model Runner (self-hosted) gate'
        required: false
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - name: Detect environment
        id: detect-env
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" == "nektos/act" ]; then
            echo "running_in_act=true" >> "$GITHUB_OUTPUT"
          else
            echo "running_in_act=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Echo environment
        shell: bash
        run: |
          echo "Running in act environment: ${{ steps.detect-env.outputs.running_in_act }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Read release version
        id: version
        shell: bash
        run: |
          # Single source of truth: <Version> in Directory.Build.props.
          VERSION=$(dotnet msbuild FluentDocker/FluentDocker.csproj -getProperty:Version -nologo -verbosity:quiet | tr -d '[:space:]')
          echo "Release version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Build examples
        if: matrix.os == 'ubuntu-latest'
        run: dotnet build Examples/Examples.sln --configuration Release

      - name: Create NuGet packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Creating NuGet packages at version ${{ steps.version.outputs.version }}"
          dotnet pack --configuration Release --no-build --output packages

      - name: Validate NuGet packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          EXPECTED=("FluentDocker" "FluentDocker.Testing.Xunit" "FluentDocker.Testing.MsTest" "FluentDocker.Testing.NUnit")
          for pkg in "${EXPECTED[@]}"; do
            ls "packages/${pkg}".*.nupkg 1>/dev/null 2>&1 || { echo "MISSING: ${pkg}"; exit 1; }
            echo "OK: ${pkg}"
          done

      - name: List NuGet packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Created NuGet packages:"
          ls -la packages/*.nupkg

      - name: Upload NuGet packages as artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: packages/*.nupkg
          retention-days: 7
        continue-on-error: ${{ steps.detect-env.outputs.running_in_act == 'true' }}

  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - name: Run unit tests with coverage (net10.0)
        run: >
          dotnet test --no-build --configuration Release --framework net10.0
          --filter "Category=Unit|TestCategory=Unit"
          --collect:"XPlat Code Coverage" --results-directory ./coverage
          --settings coverletArgs.runsettings
      - name: Enforce coverage threshold
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          COVERAGE_REPORT_DIR: ./coverage
          COVERAGE_LINE_MIN: '78'
          COVERAGE_BRANCH_MIN: '71'
        run: bash scripts/coverage-threshold
      - name: Generate per-assembly coverage report
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator "-reports:./coverage/**/coverage.opencover.xml" "-targetdir:./coverage/report" "-reporttypes:HtmlInline;TextSummary;Cobertura"
      - name: Upload coverage report artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/**/coverage.opencover.xml
            coverage/report/**
          retention-days: 7
          if-no-files-found: warn
      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Run unit tests (net8.0)
        run: >
          dotnet test --no-build --configuration Release --framework net8.0
          --filter "Category=Unit|TestCategory=Unit"

  release:
    name: Publish & Tag
    needs: [build, unit-tests]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/support/'))
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION=$(dotnet msbuild FluentDocker/FluentDocker.csproj -getProperty:Version -nologo -verbosity:quiet | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet pack --configuration Release --no-build --output packages
      - name: Publish NuGet packages
        run: dotnet nuget push "packages/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create and push Git tag for release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag $RELEASE_VERSION already exists on remote, skipping"
          else
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git tag "$RELEASE_VERSION"
            git push origin "$RELEASE_VERSION"
          fi

  # CodeQL Security Analysis
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: +security-and-quality

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build for CodeQL
        run: |
          dotnet restore
          dotnet build --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  # Integration tests — run only with the `test-integration` PR label, or on schedule/dispatch.
  # Real DMR coverage now lives in the dedicated `dmr-tests` job on a self-hosted runner;
  # this hosted lane self-skips DMR tests by design (no `docker model` on hosted runners).
  # Integration tests do NOT run on merge to main (push) — only units do.
  integration-tests:
    name: Integration Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # PRs: ubuntu only (fast feedback). Schedule/dispatch: full matrix.
        os: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_integration == true)) && fromJson('["ubuntu-latest","macos-latest","windows-latest"]') || fromJson('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    if: >
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'test-integration')) ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_integration == true)
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check Docker availability
        id: docker-check
        shell: bash
        run: |
          if docker info > /dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Docker Model Runner availability
        id: dmr-check
        shell: bash
        run: |
          # The DMR (model-runner) integration tests self-skip via the xUnit dynamic-skip
          # sentinel when the runner is absent.
          if docker model status > /dev/null 2>&1; then
            echo "Docker Model Runner is available — DMR integration tests will run"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docker Model Runner not available — DMR integration tests will skip"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - run: dotnet restore

      - run: dotnet build --configuration Debug --no-restore

      - name: Run integration tests
        if: steps.docker-check.outputs.available == 'true'
        run: dotnet test FluentDocker.Tests/FluentDocker.Tests.csproj --configuration Debug --no-build --framework net10.0 --verbosity normal --filter "Category=Integration|Category=PodmanIntegration"
        timeout-minutes: 30

      - name: Skip integration tests (no Docker)
        if: steps.docker-check.outputs.available != 'true'
        shell: bash
        run: |
          echo "Docker not available on this runner — skipping integration tests"

  dmr-tests:
    name: Docker Model Runner Gate (self-hosted)
    # Real DMR coverage. Runs only with the `test-dmr` PR label or a manual
    # workflow_dispatch run_dmr=true. Requires a self-hosted runner labeled `dmr`
    # with a working `docker model` runtime.
    if: >
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'test-dmr')) ||
      (github.event_name == 'workflow_dispatch' && inputs.run_dmr == true)
    runs-on: [self-hosted, dmr]
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify Docker Model Runner is present
        shell: bash
        run: |
          if ! docker model status > /dev/null 2>&1; then
            echo "::error::This self-hosted runner has no working 'docker model' runtime."
            exit 1
          fi
      - run: dotnet restore
      - run: dotnet build --configuration Debug --no-restore
      - name: Run real DMR tests (hard-fail on skip)
        env:
          FLUENTDOCKER_REQUIRE_DMR: '1'
        run: >
          dotnet test FluentDocker.Tests/FluentDocker.Tests.csproj
          --configuration Debug --no-build --framework net10.0 --verbosity normal
          --filter "Category=Integration&Requires=Dmr"
          --logger "trx;LogFileName=dmr.trx" --results-directory ./dmr-results
        timeout-minutes: 30
      - name: Assert at least one DMR test actually executed
        shell: bash
        run: |
          TRX=$(find ./dmr-results -name "dmr.trx" 2>/dev/null | head -1)
          if [ -z "$TRX" ]; then
            echo "::error::No DMR trx produced — the DMR lane ran zero tests."; exit 1
          fi
          # Counters total/passed in the trx ResultSummary; 0 executed => empty gate.
          EXECUTED=$(grep -oE 'executed="[0-9]+"' "$TRX" | grep -oE '[0-9]+' | head -1)
          echo "DMR tests executed: ${EXECUTED:-0}"
          if [ "${EXECUTED:-0}" -lt 1 ]; then
            echo "::error::DMR gate executed 0 tests — coverage is empty, failing."; exit 1
          fi

  # Model Runner benchmarks — deterministic (no DMR), so they run anywhere. Kept off
  # PRs to keep them fast; runs on schedule or manual dispatch only. A perf blip must
  # never fail CI, so this job is non-gating (continue-on-error) and uploads results.
  model-runner-benchmarks:
    name: Model Runner Benchmarks
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    continue-on-error: true
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run Model Runner benchmarks (short job)
        run: >
          dotnet run -c Release --project FluentDocker.Benchmarks --
          --filter "*ModelRunner*"
          --job short

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-runner-benchmarks
          path: BenchmarkDotNet.Artifacts/**
          retention-days: 7
          if-no-files-found: warn
